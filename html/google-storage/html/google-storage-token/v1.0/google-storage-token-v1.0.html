            <section id=client-id-root class=field>
            
                  <label>
                        client id
                  </label>
                  
                  <img class='paste icon'>
                  <img class='storage icon'>
                  <input id=client-id autocomplete=off spellcheck=false>
                  <img class='copy icon'>
                  
            </section>
            
            <section id=client-secret-root class=field>
            
                  <label>
                        client secret
                  </label>
                  
                  <img class='paste icon'>
                  <img class='storage icon'>
                  <input id=client-secret autocomplete=off spellcheck=false>
                  <img class='copy icon'>
                  
            </section>
            
            <section id=refresh-token-root class=field>
            
                  <label>
                        refresh token
                  </label>
                  
                  <img class='paste icon'>
                  <img class='storage icon'>
                  <input id=refresh-token autocomplete=off spellcheck=false>
                  <img class='refresh icon'>
                  <img class='copy icon'>
                  
            </section>

                        keyfile
                  </label>

                        no file

                  <label>
                        token
                  </label>

                  <img class='storage icon'>
                  <input id=token autocomplete=off spellcheck=false>
                  <img class='copy icon'>

      </template>
      
      
      <script>
      
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='google-storage-token';
        
        var key,par,$,gs
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    key         = mod.rd(params,'key',key);
                    par         = mod.rd(params,'google-storage',par);
                    gs          = mod.rd(params,'gs',gs);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        
        var keyfile;
        var scope     = ['https://www.googleapis.com/auth/devstorage.read_write'];
        
        
        
        var btn       = {};
        btn.keyfile   = {};
        btn.token     = {};
        obj.rd        = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
        
              shadow                                      = host.shadowRoot;
              
              par.ui.setup(shadow);
              
              
            //client_id
            
              var clientid;
              try{
              
                    clientid                              = window.localStorage[key+'client-id'];
                    
              }//try
              catch(err2){}
              $(shadow,'#client-id').value                = clientid||'';
              
              
            //client_secret
            
              var err;
              try{
              
                    var clientsecret                      = window.localStorage[key+'client-secret'];
                    
              }//try
              catch(err2){}
              
              $(shadow,'#client-secret').value            = clientsecret||'';
              
              
            //refresh-token
            
              try{
              
                    var refresh                           = window.localStorage[key+'refresh-token'];
                    
              }//try
              catch(err2){}
              
              $(shadow,'#refresh-token').value            = refresh||'';
              $(shadow,'.refresh.icon').onclick           = btn.token.refresh;
              
              
              $(shadow,'#keyfile-root .file').onclick           = btn.keyfile.file;
              $(shadow,'#keyfile-root .refresh').onclick        = btn.keyfile.refresh;
              
              
            //token
            
              var root2                                   = $(shadow,'#token-root');
              var err;
              try{
              
                    var token                             = window.localStorage[key+'token'];
                    
              }//try
              catch(err2){}
              $(shadow,'#token').value                    = token||'';
              
              
        }//initdom
        
        
  //:
  
  
        btn.keyfile.file    = function(){
        
              var input         = document.createElement('input');
              input.type        = 'file';
              input.onchange    = onchange;
              input.click();
              
              
              async function onchange(){
              
                    var file      = input.files[0];
                    $(shadow,'#keyfile-root #name').textContent    = file.name;
                    var txt       = await file.text();
                    keyfile       = JSON.parse(txt);
                    create();
                    
              }//onchange
              
        }//file
        
        
        btn.keyfile.refresh   = function(){
        
              create();
              
        }//refresh
        
        
        btn.token.refresh   = async function(){
        
              var id        = $(shadow,'#client-id').value;
              var secret    = $(shadow,'#client-secret').value;
              var refresh   = $(shadow,'#refresh-token').value;
              
              var token     = await gs.refresh(id,secret,refresh);
              
              try{
              
                    localStorage[localstorage+'token']    = token;
                    
              }//try
              catch(err2){}
              
              $(shadow,'#token').value              = token;
              
              $.mousetext('token refreshed');
              
        }//refresh
        
        
  //:
  
  
        obj.rd.token    = function(){
        
              var token   = $(shadow,'#token').value;
              return token;
              
        }//token
        
        
  //:
  
  
        async function create(){
        
        
              var {json,error}    = await gs.token.fromkeyfile(keyfile,scope);
              if(error){
                    log.error(error);
                    return;
              }
              
              var token                   = json.access_token;
              $(shadow,'#token').value    = token;
              
        }//create
        
        
        
        
        
  return obj;
  
  
//google-storage-token
})


      </script>
      
      
</google-storage-token>
