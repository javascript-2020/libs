<google-storage-file-nav>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {flex:1;display:flex;flex-direction:column}
    
  #root
    {flex:1;display:flex;flex-direction:column;gap:10px}
    
  #btns
    {display:flex;justify-content:center;gap:25px}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box;}
  input:not([type])
    {flex:1}
  input[type=button]
    {cursor:pointer}
    
    
            </style>
            
            <div id=root>
            
                  <div id=token-root>
                        <label>
                              token
                        </label>
                        <input id=token>
                  </div>
                  
                  <div id=bucket-root>
                        <label>
                              bucket
                        </label>
                        <input id=bucket value=ext-code-test>
                  </div>
                  
                  <file-nav component>
                  </file-nav>
                  
                  <div id=btns>
                        <input value=update type=button>
                  </div>
                  
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  }
        var df=true,did='google-storage-file-nav';
        
        var debug,gs;
        
        obj.initmod   = function(params){
        
              debug   = mod.rd(params,'debug',debug);
              gs      = mod.rd(params,'gs',gs);
              
        }//initmod
        
        
  //:
  
  
        var filenav;
        
        var shadow;
        
        var btn     = {};
        var file    = {};
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init');
console.log('gs',gs);

              await mod.auto();
              
              filenav   = mod['file-nav'];
              
              filenav.file.click        = file.click;
              filenav.file.dblclick     = file.dblclick;
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow      = host.shadowRoot;
              
              var btns    = $(shadow,'#btns');
              $(btns,'[value=update]').onclick        = btn.update;
              
        }//initdom
        
        
  //:
  
  
        btn.update    = function(){
        }//update
        
        
        
        
  return obj;
  
})

      </script>
      
</google-storage-file-nav>
