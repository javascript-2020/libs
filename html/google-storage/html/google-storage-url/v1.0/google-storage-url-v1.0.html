

<google-storage-url>

      <template shadowrootmode=open>
      
            <style>
            
            
  :host
    {display:flex;flex-direction:column;gap:10px}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box;}
  input:not([type])
    {flex:1}
  input[type=button]
    {cursor:pointer}
    
    
            </style>
            
            
            <section id=url-root class=field>
            
                  <label>
                        parse url
                  </label>
                  
                  <img class='paste icon'>
                  <input id=url autocomplete=off spellcheck=false>
                  <input type=button value=parse>
                  <input type=button value='+'>
                  
            </section>
            
            
            <section id=bucket-root class=field>
            
                  <label>
                        bucket name
                  </label>
                  
                  <img class='paste icon'>
                  <input id=bucket autocomplete=off spellcheck=false>
                  
            </section>
            
            
            <section id=path-root class=field>
            
                  <label>
                        path
                  </label>
                  
                  <img class='icon paste'>
                  <input id=path autocomplete=off spellcheck=false>
                  
            </section>
            
      </template>
      
      <script>
      
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='google-storage-url';
        
        var debug,par,key,$
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    debug       = mod.rd(params,'debug',debug);
                    par         = mod.rd(params,'google-storage',par);
                    key         = mod.rd(params,'key',key);
                    $           = mod.rd(params,'$',$);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        
        var btn           = {};
        obj.rd            = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                                      = host.shadowRoot;
              
              par.ui.setup(shadow);
              
              
            //url
            
              $(shadow,'[value=parse]').onclick           = btn.parse;
              $(shadow,'[value="+"]').onclick             = btn.parse.load;
              
              
              
        }//initdom
        
        
  //:
  
  
        btn.parse   = function(){
        
              var url                     = $(shadow,'#url').value;
              var {bucket,path}           = gs.parse(url);
              $(shadow,'#bucket').value   = bucket;
              $(shadow,'#path').value     = path;
              
        }//parse
        
        
        btn.parse.load    = function(){
        
              btn.parse();
              
              var token     = par.rd.token();
              var bucket    = $(shadow,'#bucket').value;
              var path      = $(shadow,'#path').value;
              
              par.load.ui(token,bucket,path);
              
        }//load
        
        
        
  //:
  
  
        obj.rd.bucket   = function(){
        
              var bucket    = $(shadow,'#bucket').value;
              return bucket;
              
        }//bucket
        
        
        obj.rd.path   = function(){
        
              var path    = $(shadow,'#path').value;
              return path;
              
        }//path
        
        
  //:
  
  
  
  
  return obj;
  
//google-storage-url
})


      </script>
      
</google-storage-url>
