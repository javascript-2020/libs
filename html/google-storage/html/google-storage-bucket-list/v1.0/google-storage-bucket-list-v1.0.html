

<google-storage-bucket-list style='height:300px;display:none'>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {flex:1;display:flex;flex-direction:column;gap:10px}
    
  #hdr
    {display:flex;gap:10px;align-items:center}
    
  #hdr #project
    {flex:1}
    
  #list
    {flex:1;display:flex;flex-direction:column;border:1px solid lightgray;padding:10px;overflow:auto}
    
  #list:nth-child(odd)
    {background-color:white}
    
  #list:nth-child(even)
    {background-color:lightgray}
    
  .item
    {display:flex;align-items:center}
  .item .name
    {padding:5px 10px}
    
  #empty
    {text-align:center;color:gray;font-weight:bold}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box;}
  input:not([type])
    {flex:1}
  input[type=button]
    {cursor:pointer}
    
            </style>
            
            <div id=hdr>
                  <label>
                        project
                  </label>
                  <input id=project>
                  <input value=read type=button>
            </div>
            
            <div id=list>
                  <div class=item>
                        <div class=name></div>
                        <img class='copy icon'>
                        <img class='rem icon'>
                  </div>
                  <div id=empty>
                        Empty
                  </div>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='google-storage-bucket-list';
        
        var $,par,key,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $       = mod.rd(params,'$',$);
                    par     = mod.rd(params,'google-storage',par);
                    key     = mod.rd(params,'localstorage',key);
                    debug   = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        var list;
        var item;
        var empty;
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow                              = host.shadowRoot;
              
              par.ui.initdom(shadow);
              
              var hdr                             = $(shadow,'#hdr');
              $(hdr,'[value=read]').onclick       = btn.read;
              
              list                                = $(shadow,'#list');
              item                                = $(list,'.item');
              item.remove();
              empty                               = $(list,'#empty');
              
              
              
              
              var value;
              try{
              
                    value   = localStorage[key+'bucket-list-project'];
                    
              }//try
              catch(err2){}
              if(value){
                    $(shadow,'#project').value    = value;
              }
              
              var names;
              try{
              
                    var str     = localStorage[key+'bucket-list-names'];
                    names       = JSON.parse(str);
                    
              }//try
              catch(err2){}
              if(names){
                    display(names);
              }
              
              
              
        }//initdom
        
        
  //:
  
  
        btn.read    = async e=>{
        
              var project   = $(shadow,'#project').value;
              var token     = par.rd.token();
              
              var {names,error}   = await gs.bucket.list({token,project});
              if(error){
                    log.error(error);
                    return;
              }
              display(names);
              
        }//read
        
        
  //:
  
  
        function display(names){
        
              list.replaceChildren();
              if(names.length==0){
                    list.append(empty);
                    return;
              }
              
              names.forEach(name=>{
              
                    var nitem                       = item.cloneNode(true);
                    
                    $(nitem,'.name').textContent    = name;
                    $(nitem,'.rem').onclick         = e=>rem(name,nitem);
                    
                    list.append(nitem);
                    
              });
              
              store();
              
              
              function store(){
              
                    var str   = JSON.stringify(names);
                    try{
                    
                          localStorage[key+'bucket-list-names']   = str;
                          
                    }//try
                    catch(err2){}
                    
              }//store
              
              
              function rem(name,item){
              
                    var i   = names.findIndex(name2=>name2===name);
                    if(i==-1)return;
                    names.splice(i,1);
                    item.remove();
                    store();
                    
              }//rem
              
        }//display
        
        
  //:
  
  
  return obj;
  
//google-storage-bucket-list
})

      </script>
      
</google-storage-bucket-list>
