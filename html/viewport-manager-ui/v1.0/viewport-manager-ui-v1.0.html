<veiwport-manager-ui>

      <template shadowrootmode=open>
      
            <style>
            
  .item
    {}
    
  .show
    {}
  .hide
    {}
  .close
    {}
    
  .spc
    {flex:1}
    
            </style>
            
            <div id=root>
            
                  <div class=item>
                  
                        <div class=name>
                        </div>
                        
                        <div class=spc>
                        </div>
                        
                        <div class=show>
                        </div>
                        <img class=hide>
                        <img class=close>
                  </div>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {};
  
        var df=true,did='viewport-manager-ui';
        
        
        obj.initmod   = function(params){
        }//initmod
        
        
  //vars:-
  
  
        var shadow;
        var root;
        
        
  //:
  
  
        obj.init    = async function(){
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
              shadow    = host.shadowRoot;
              root      = $(shadow,'#root');
              
              await createviewport();
              
              
              item      = $(shadow,'.item');
              item.remove();
              
              
        }//initdom
        
        
        async function createviewport(){
        
              viewport    = await vm.new({par:root,title:'snippet-nodejs'});
              viewport.pos({x:250,y:200,w:850,h:500});
              viewport.css(`#body {display:flex;flex-direction:column}`);
              viewport.body.append(host);
              viewport.mod    = obj;
              
        }//createviewport
        
        
  //:
  
  
        obj.show    = function(){
        }//show
        
        
        obj.hide    = function(){
        }//hide
        
        
        function update(){
        
              vm.list.forEach(vp=>{
              
                    var nitem                           = item.cloneNode(true);
                    
                    $(nitem,'.name').textContent        = vp.name||'';
                    
                    $(nitem,'.show').onclick            = e=>vp.show();
                    $(nitem,'.hide').onclick            = e=>vp.hide();
                    $(nitem,'.close').onclick           = e=>vp.close();
                    
              });
              
        }//update
        
        
  return obj;
  
})
</viewport-manager-ui>
