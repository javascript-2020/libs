      <script>
      
(function({mod,host}){

  var obj   = {};
  
        var df=true,did='viewport-manager-ui';
        
        var $,vm
        ;
        
        obj.initmod   = function(params){
        
              $       = mod.rd(params,'$',$);
              vm      = mod.rd(params,'vm',vm);
              debug   = mod.rd(params,'debug',debug);
              
        }//initmod
        
        
  //vars:-
  
  
        var shadow;
        var root;
        var list;
        
        
        var icon_src    = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAMAAAAM7l6QAAAA5FBMVEVHcEwBAQIAAAAgIiVVW14WIjIgIiQICxIAAAACAAAyTnMYJTdCRkgKCwwSGycFBgoUFRfE0tecp6tdY2YnPFkrQ2Lm+PyZuv/r/f/p+//C0NMhM0uLlJjk9fk6XYc5W4R0fX87XolFTlrt//+yv8Kau/+Go+DZ6u2cvv+Dn9tVYGo2Vn0wTXC/2PBjd6SFl6dDT2mfssKYufw8Q08fLT7P4++avP+Rnqc+SWHf8PQoQF2gtsh+h4rC3PNjeKa4xslUZY27ycw7X4pmc4BYXl+wxtw0OT1QWWJVXmiwx91WYWokOVRJzUyTAAAAFnRSTlMABSyx7OyzsyYSt+fncel0saW95snDaeRPrQAAARZJREFUKM+l03lTgkAcgGHQSPHuAtfiBjPXSgIBSfPq7vt/n34sR5z948OwA/Oyw87sLEUdh27WAjRbY6PHWJOG3O8xoN26Yi5bbSat14fJjZkkSRhuSRSlNHHWoIPs+9jGP74iZilRxliEC++VrH2Y7esKdpAH8k0FeQC5PtIQMdQSw+BdG9VJRhyx3OixRfCOMhlt3j+nxLe1QvksLM2Pe2K9eJTzGbmqZauhr5Isb8d3Icssyy8TwzAcx+Hn5ptezA8Tnniam+vCyjPZXf03+7ns3xX5NJ+9w7Qkk5UD3nuV9WLejiOeriEun11LjcWbkMqccJsINzDOO6EAvoZhB5nqdk4Kzs8uYOx0/45BBksnx+AYv0siS0o+IsmAAAAAAElFTkSuQmCC';
        obj.icon_src    = icon_src;
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
                                                                                //debug=eval debug.mod;
                                                                                debug('init');
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
        
        
              await createviewport();
              
              host.style.display                      = '';
              
              shadow                                  = host.shadowRoot;
              
              root                                    = $(shadow,'#root');
              
              $(root,'[value=update]').onclick        = btn.update;
              
              list                                    = $(root,'#list');
              item                                    = $(list,'.item');
              item.remove();
              
              
        }//initdom
        
        
        async function createviewport(){
        
              viewport        = await vm.new({title:'viewport-manager-ui',initmod:{config:{icons:{close:false}}}});
              viewport.hide();
              obj.viewport    = viewport;
              
              viewport.pos({x:250,y:200,w:450,h:350});
              viewport.css(`#body {display:flex;flex-direction:column}`);
              viewport.mod    = obj;
              
              viewport.body.append(host);
              
        }//createviewport
        
        
  //:
  
  
        btn.update    = function(){
        
              update();
              
        }//update
        
        
  //:
  
  
  
  
        obj.show    = function(){
        
              update();
              viewport.show();
              
        }//show
        
        
        obj.show.toggle    = function(){
        
              viewport.show.toggle();
              if(viewport.status=='visible'){
                    update();
              }
              
        }//icon
        
        
        obj.hide    = function(){
        
              viewport.hide();
              
        }//hide
        
        
        obj.update    = update;
        
        function update(){
        
              list.replaceChildren();
              
              vm.list.forEach(vp=>{
              
                    var nitem                           = item.cloneNode(true);
                    
                    $(nitem,'.v-icon').src              = vp.icon()||'';
                    $(nitem,'.title').textContent       = vp.title()||'';
                    
                    $(nitem,'.show').onclick            = e=>vp.show();
                    $(nitem,'.minify').onclick          = e=>vp.hide();
                    $(nitem,'.close').onclick           = e=>vp.close();
                    
                    list.append(nitem);
                    
              });
              
        }//update
        
        
        
        
        
        
        
        
  return obj;
  
})


      </script>
