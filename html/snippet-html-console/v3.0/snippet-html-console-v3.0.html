            <div id=root>
            
                  <div id=title>
                        <div class=spc></div>
                        <div id=mod-name>

                  </div>
                  
                  <div id=hdr>
                        <file-mod v2.1 component></file-mod>
                        <div class=spc></div>
                        <img id=btn-html title=html class=icon>
                        <img id=btn-web-console title=console class=icon>
                        <img id=open title='open in editor' class=icon>
                  </div>
                  
                  <web-editor component mode=html></web-editor>
                  
                  <div id=iframe-btns>
                        <input value=run type=button>
                        <input value=kill type=button>
                        <input value=reset type=button>

                        <img id=btn-editor class=icon>
                        <img id=btn-web-console title=console class=icon>
                  </div>
                  
                  <div id=hldr part=hldr>
                        <iframe></iframe>
                  </div>
                  
                  <div id=web-console-btns>
                        <input value=clear type=button>
                        <div class=spc></div>
                        <img id=btn-editor class=icon>
                        <img id=btn-html title=html class=icon>

                  <web-console component></web-console>
                  
            </div>
            
            
            <style id=proxy>
                  body{margin:0}
                  iframe{border:none;width:100%;height:100%}
            </style>

      <script>
      
      
(function snippet_html_console({mod,host}){

  var obj   = {
        version   : 'v2.1',
  };
  
        var df=true,did='snippet-html-console';
        
        var ext,$,menu,ace,menumod,log,config={},debug
        ;
        
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext           = mod.rd(params,'ext',ext);
                    $             = mod.rd(params,'$',$);
                    menu          = mod.rd(params,'menu',menu);
                    ace           = mod.rd(params,'ace',ace);
                    menumod       = mod.rd(params,'menumod',menumod);
                    log           = mod.rd(params,'log',log);
                    debug         = mod.rd(params,'debug',debug);
                    
                    config        = mod.rd(params,'config',config,config);
                    
              });
              
        }//initmod
        
        
  //vars:
  
        config                  = {};
        config['web-editor']    = {
                                        xyz:123,
                                  };
                                  
        config['web-console']   = {
                                  };
                                  
                                  
        var filemod;
        obj.filemod   = null;
        var editor;
        obj.editor    = null;
        var webconsole;
        obj.console   = null;
        
        
        var host;
        var shadow;
        var root;
        
        var src;
        
        
        var hldr;
        var proxy;
        var sandbox_url   = 'https://sandbox.ext-code.com/html-sandbox-v5.0/html-sandbox-v5.0.html';
        var iframe;
        
        
        var def               = {};
        def.html              = null;
        
        def.iframe            = {};
        def.iframe.height     = '300px';
        
        def.console           = {};
        def.console.height    = '200px';
        
        def.sandbox           = 'standard';
        def.permissions       = 'standard';
        
        
        
        var preset    = {};
        
        var values    = [
              'allow-downloads',
              'allow-forms',
              'allow-modals',
              'allow-orientation-lock',
              'allow-pointer-lock',
              'allow-popups',
              'allow-popups-to-escape-sandbox',
              'allow-presentation',
              'allow-same-origin',
              'allow-scripts',
              'allow-storage-access-by-user-activation',
              'allow-top-navigation',
              'allow-top-navigation-by-user-activation',
              'allow-top-navigation-to-custom-protocols'
        ];
        
        preset.sandbox              = {};
        preset.sandbox.min          = 'allow-scripts';
        preset.sandbox.standard     = 'allow-downloads allow-forms allow-same-origin allow-scripts';
        preset.sandbox.trusted      = 'allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-storage-access-by-user-activation';
        preset.sandbox.all          = values.join(' ');
        
        
        var values  = [
              'accelerometer',
              'ambient-light-sensor',
              'autoplay',
              'battery',
              'bluetooth',
              'browsing-topics',
              'camera',
              'captured-surface-control',
              'clipboard-read',
              'clipboard-write',
              'compute-pressure',
              'cross-origin-isolated', // <--- Added
              'deferred-fetch',        // <--- Added
              'display-capture',
              'encrypted-media',
              'fullscreen',
              'gamepad',
              'geolocation',
              'gyroscope',
              'hid',
              'idle-detection',
              'local-fonts',
              'local-network',         // <--- Added
              'magnetometer',
              'microphone',
              'midi',
              'payment',
              'picture-in-picture',
              'publickey-credentials-get',
              'screen-wake-lock',
              'serial',
              'speaker-selection',
              'storage-access',
              'usb',
              'web-share',
              'window-management',
              'xr-spatial-tracking'
        ];
        
        preset.allow              = {};
        preset.allow.min          = `autoplay; encrypted-media; picture-in-picture;`
        preset.allow.standard     = `clipboard-write; clipboard-read; autoplay; cross-origin-isolated; encrypted-media; picture-in-picture;
                                      screen-wake-lock; web-share;`;
        preset.allow.trusted      = `clipboard-write; clipboard-read; camera; cross-origin-isolated; microphone; geolocation; accelerometer; gyroscope; local-network
                                       magnetometer; payment; usb; serial; bluetooth; xr-spatial-tracking; autoplay; encrypted-media; picture-in-picture;
                                       screen-wake-lock; web-share;`;
        preset.allow.all          = values.join('; ');+';'
        
        
        
        
        
        var rd                = {};
        rd.attr               = {};
        var btn               = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
              var dom_config          = mod.rd.config(host);
              config                  = Object.assign(config,dom_config);
              
              config['web-editor']    = mod.rd.attr(host,'web-editor',config);
              config['web-console']   = mod.rd.attr(host,'web-console',config);
              
              if(!('fullsize' in config['web-editor'])){
                    config['web-editor'].fullsize    = true;
              }
                                                                                window.console.json(config);
                                                                                debug('config',config);
                                                                                
                                                                                
              def.html          = $.htmlentities.decode(host);
              
              
              mod.base.add({complete,source});
              
              
              filemod           = mod['file-mod'];
              obj.filemod       = filemod;
              editor            = mod['web-editor'];
              obj.editor        = editor;
              webconsole        = mod['web-console'];
              obj.console       = webconsole;
              
              editor.initmod({config:config['web-editor'],kd});
              webconsole.initmod({config:config['web-console']});
              
              
              await mod.auto();
              
              
              
              await Promise.all([
                    rd.attr.src(),
              ]);
              
              
        }//init
        
        
        rd.attr.src    = async function(){
        
              if(!host.hasAttribute('src'))return;
              src         = host.getAttribute('src');
              var res     = await fetch(src);
              var txt     = await res.text();
              def.html    = txt;
              
        }//src
        
        
        function events(){
        
              proxy.contentWindow.addEventListener('message',e=>{
                                                                                //console.log('proxy',e.data);
                    if(e.data?.type==='console'){
                          var {name,html}   = e.data;
                          webconsole[name].display(html);
                    }
                    
              });
              
        }//events
        
        
  //:
  
  
        obj.initdom    = function(){
        
              shadow                                      = host.shadowRoot;
              
              
              editor.setvalue(def.html);
              
              if(src){
                    editor.filename(src);
              }
              
              $(shadow,'#btn-editor').onclick             = btn-editor;
              $(shadow,'#btn-html').onclick               = btn.html;
              $(shadow,'#btn-web-console').onclick        = btn['web-console'];
              $(shadow,'#open').onclick                   = btn.open;
              
              $(shadow,'[value=run]').onclick             = btn.run;
              $(shadow,'[value=kill]').onclick            = btn.kill;
              $(shadow,'[value=clear]').onclick           = btn.clear;
              $(shadow,'[value=reset]').onclick           = btn.reset;
              
              
              hldr                                        = $(shadow,'#hldr');
              proxy                                       = $(hldr,'iframe');
              var style                                   = $(shadow,'style#proxy');
              proxy.contentDocument.head.append(style);
              
              create();
              events();
              
                                                                          debug('def.console.height',def.console.height);
              console.height    = def.console.height;
              
              
        }//initdom
        
        
  //:
  
  
        function kd(e){
        
              if(e.ctrlKey && e.key=='Enter'){
                    run();
              }
              
        }//kd
        
        
        btn.reset   = function(){
        
              editor.setvalue(def.html);
              
        }//reset
        
        
        btn.run   = function(){
        
              run();
              
        }//run
        
        
        btn.kill    = function(){
        
              kill();
              
        }//kill
        
        
        btn.clear   = function(){
        
              clear();
              
        }//clear
        
        
        btn.editor    = function(){
        
              $(shadow,'web-editor').scrollIntoView({behavior:'smooth'});
              
        }//editor
        
        
        btn.html    = function(){
        
              $(shadow,'#hldr').scrollIntoView({behavior:'smooth'});
              
        }//html
        
        
        btn['web-console']    = function(){
        
              $(shadow,'web-console').scrollIntoView({behavior:'smooth'});
              
        }//web-console
        
        
  //:
  
  
        obj.clear   = function(){return clear()}
        
        function clear(){
                                                                                debug('clear');
              //create();
              webconsole.clear();
              
        }//clear
        
        
        
  //:
  
  
        function create({src,onload:ponload,sandbox,allow}={}){
                                                                                debug('create');
              if(iframe){
                    iframe.remove();
              }
              iframe    = document.createElement('iframe');
              
              
              sandbox   ||= def.sandbox;
              if(sandbox in preset.sandbox){
                    sandbox   = preset.sandbox[sandbox];
              }
              iframe.setAttribute('sandbox',sandbox);
              
              
              allow   ||= def.allow;
              if(allow in preset.allow){
                    allow   = preset.allow[allow];
              }
              iframe.setAttribute('allow',allow);
              
              src       ||= sandbox_url;
              
              
                                                                                debug('crossOriginIsolated',window.crossOriginIsolated);
              var url     = new URL(src);
              if(window.crossOriginIsolated){
                    url.searchParams.set('isolate','');
              }
              var search    = url.search.replace(/=(?=&|$)/g,'');
              src           = url.origin+url.pathname+search+url.hash;
                                                                                debug(src);
                                                                                
              iframe.src      = src;
              iframe.onload   = onload;
              
              hldr.style.height     = def.iframe.height;
              proxy.contentDocument.body.append(iframe);
              
              
              function onload(){
              
                    if(typeof ponload=='function'){
                          ponload();
                    }
                    
              }//onload
              
        }//create
        
        
        function send(payload){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              var msgid   = crypto.randomUUID();
              
              proxy.contentWindow.addEventListener('message',onmessage);
              iframe.contentWindow.postMessage({msgid,payload},'*');
              
              return promise;
              
              
              function onmessage(e){
              
                    if(e.data?.msgid!==msgid)return;
                    proxy.contentWindow.removeEventListener('message',onmessage);
                    var {result,error}    = e.data;
                    resolve({result,error});
                    
              }//onmessage
              
        }//send
        
        
        obj.run   = function(){return run()}
        
        async function run(){
                                                                                debug('run');
              var resolve,promise=new Promise(res=>resolve=res);
              
              var html        = editor.getvalue();
              var echo    = true;
              
              var fn          = await upload();
              var src         = sandbox_url+'?fn='+fn;
                                                                                debug(src);
              create({src,onload});
              
              return promise;
              
              
              async function upload(){
                                                                                debug('upload');
                    var {result,error}    = await send({type:'upload',html,echo});
                    if(error){
                                                                                debug(error);
                          log.red(error);
                          return;
                    }
                                                                                debug('ok');
                    var fn    = result;
                    return fn;
                    
              }//upload
              
              
              async function onload(){
                                                                                debug('onload');
                    iframe.onload   = null;
                    iframe.contentWindow.focus();
                    
                    //var h   = niframe.contentDocument.documentElement.scrollHeight;
                    //hldr.style.height   = h+'px';
                    
                    resolve();
                    
              }//onload
              
              
              
              
        }//run
