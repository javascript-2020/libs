      <script>
      
      
(function({mod,dom,host}){

  var obj   = {
        version   : 'v3.0'
  };
  
        var df=true,did='github-fs';
        
        var ext,$,menu,focus,source,log,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext           = mod.rd(params,'ext',ext);
                    $             = mod.rd(params,'$',$);
                    menu          = mod.rd(params,'menu',menu);
                    log           = mod.rd(params,'log',log);
                    debug         = mod.rd(params,'debug',debug);
                    focus         = mod.rd(params,'focus',focus);
                    source        = mod.rd(params,'source',source);
                    
              });
              
        }//initmod
        
        
  //vars:-
  
        var github;
        var github_url;
        var github_token;
        
        var shadow;
        var style;
        
        var icon;
        
        
        var ui            = {};
        var btn           = {};
        btn.tabs          = {};
        
        
  //:
  
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
              shadow                          = host.shadowRoot;
              style                           = $(shadow,'style');
              //var style2                      = $.stylesheet.find.css('.icon','style');
              //$.stylesheet.copyrule(style2,'.icon',style);
              
              await libs();
              
              mod.base.add({par:obj,ui});
              
              github_url          = mod['github-fs-url'];
              github_token        = mod['github-fs-token'];
              
              await mod.auto();
              
              
        }//init
        
        
        async function libs(){
        
              [github]    = await ext.load.libs('js/io/github/github.js');
              
        }//load
        
        
  //:
  
  
        obj.initdom   = function(){   //c
                                                                                debug('initdom');
                                                                                
              menu.add.style(shadow);
              
              var style                                 = $(shadow,'style');
              $.stylesheet.insert(style,'.icon');
              
              var node                                  = $(shadow,'.menu');
              icon                                      = $(shadow,'#icon');
              icon.onclick                              = menu.click(node,{callback:menu_callback});
              menu.input.norm(node);
              
              
              $(shadow,'#tabs #url').onclick            = btn.tabs.url;
              $(shadow,'#tabs #filenav').onclick        = btn.tabs.filenav;
              
              
        }//initdom
        
        
        ui.initdom    = function(shadow){
        
              var style2    = $(shadow,'style');
              var list      = ['.icon','.field',,'.field label','.paste','.copy','.storage','input','input:not([type])','input[type=button]'];
              $.stylesheet.copyrule(style,list,style2);
              
              $.all(shadow,'.paste').forEach(icon=>{
              
                    icon.onclick    = async e=>{
                    
                                            var txt       = await navigator.clipboard.readText();
                                            var par       = icon.parentNode;
                                            var input     = $(par,'input:not([type])');
                                            input.value   = txt;
                                            input.focus();
                                            
                                      };
                                      
              });
              
              $.all(shadow,'.copy').forEach(icon=>{
              
                    icon.onclick    = async e=>{
                    
                                            var par     = icon.parentNode;
                                            var input   = $(par,'input:not([type])');
                                            var txt     = input.value;
                                            await navigator.clipboard.writeText(txt);
                                            $.mousetext(e,'copied');
                                            
                                      }//click
                                      
              });
              
              $.all(shadow,'.storage').forEach(icon=>{
              
                    icon.onclick    = async e=>{
                    
                                                      var icon      = e.target;
                                                      var input     = $(icon.parentNode,'input:not([type])');
                                                      
                                                      if(e.shiftKey){
                                                            var token   = input.value;
                                                            if(!token){
                                                                  $.mousetext('no token');
                                                                  return;
                                                            }
                                                            
                                                            var err;
                                                            try{
                                                            
                                                                  localStorage.setItem('github-token',token);
                                                                  
                                                            }//try
                                                            catch(err2){
                                                            
                                                                  err   = err2;
                                                                  
                                                            }//catch
                                                            if(err){
                                                                  var error   = err.toString();
                                                                  log.red(error);
                                                                  return;
                                                            }
                                                            
                                                            $.mousetext(e,'localStorage[\'github-token\'] saved');
                                                            return;
                                                      }
                                                      
                                                      var token;
                                                      var err;
                                                      try{
                                                      
                                                            token   = localStorage.getItem('github-token');
                                                            
                                                      }//try
                                                      catch(err2){
                                                      
                                                            err   = err2;
                                                            
                                                      }//catch
                                                      if(err){
                                                            var error   = err.toString();
                                                            log.red(error);
                                                            return;
                                                      }
                                                      
                                                      if(!token){
                                                            $.mousetext('no stored token, localStorage[\'github-token\']');
                                                            return;
                                                      }
                                                      input.value   = token;
                                                      
                                                };
              })//storage
              
              
        }//initdom
        
        
  //:
  
  
        btn.tabs.url    = e=>{
        
              mode    = 'url';
              
              $(shadow,'#tabs #url').classList.add('active');
              $(shadow,'#tabs #url').classList.remove('inactive');
              $(shadow,'#tabs #filenav').classList.remove('active');
              $(shadow,'#tabs #filenav').classList.add('inactive');
              
              $(shadow,'#view github-fs-url').style.display       = '';
              $(shadow,'#view github-fs-filenav').style.display   = 'none';
              
        }//url
        
        
        btn.tabs.filenav    = e=>{
        
              mode    = 'filenav';
              
              $(shadow,'#tabs #url').classList.remove('active');
              $(shadow,'#tabs #url').classList.add('inactive');
              $(shadow,'#tabs #filenav').classList.add('active');
              $(shadow,'#tabs #filenav').classList.remove('inactive');
              
              $(shadow,'#view github-fs-url').style.display       = 'none';
              $(shadow,'#view github-fs-filenav').style.display   = '';
              
        }//filenav
        
        
  //:
  
  
        function github_kd(e){
        
              //  only needs to return undefined to stop keydown stack from running
              
              if(e.key=='Escape'){
                    if(typeof focus=='function'){
                          focus();
                    }
                    return false;
              }
              
        }//github_kd
        
        
        function menu_callback(type){
                                                                                debug('menu_callback',arguments);
              if(type=='show'){
                    $(shadow,'#token').focus();
                    //keydown.add(github_kd);
              }
              if(type=='hide'){
                    //keydown.rem(github_kd);
              }
              
        }//callback
        
        
        obj.read    = read;
        
        function read(){
        
              var token     = read.token();
              var owner     = $(shadow,'#owner').value;
              var repo      = $(shadow,'#repo').value;
              var branch    = $(shadow,'#branch').value;
              var path      = $(shadow,'#path').value;
                                                                                debug(owner,repo,branch,path);
              return {token,owner,repo,branch,path};
              
        }//read
        
        
        read.token    = function(){
        
              var token     = $(shadow,'#token').value;
              return token;
              
        }//token
        
        
        obj.write   = write;
        
        function write(owner,repo,branch,path){
                                                                                debug(owner,repo,branch,path);
              $(shadow,'#owner').value    = owner;
              $(shadow,'#repo').value     = repo;
              $(shadow,'#branch').value   = branch;
              $(shadow,'#path').value     = path;
              
        }//write
        
        
        obj.clear   = function(){
        
              $(shadow,'#owner').value    = '';
              $(shadow,'#repo').value     = '';
              $(shadow,'#branch').value   = '';
              $(shadow,'#path').value     = '';
              
        }//clear
        
        
  //:
  
  
        obj.load    = function(file,api){return load(file,api)}
        
        async function load(file,api){
        
              var token                       = read.token();
              var {owner,repo,branch,path}    = file;
              
              //var result    = await loadfile(api,token,owner,repo,branch,path);
              var result    = await github.load({token,owner,repo,branch,path});
              return result;
              
        }//load
        
        
        obj.save    = function(file,blob){return save(file,blob)}   //d
        
        async function save(file,blob){
        
              var token                       = read.token();
              var {owner,repo,branch,path}    = file;
              
              //var result    = await savefile(token,owner,repo,branch,path,blob);
              var result    = await github.save(token,owner,repo,branch,path,blob);
              if(result.ok){
                    obj.save.complete(file);
              }
              return result;
              
        }//save
        
        
  //:
  
  
        obj.export    = function(){
        
              var {owner,repo,branch,path}    = read();
              return {owner,repo,branch,path};
              
        }//export
        
        
  //:
  
  
        obj.icon    = function(){
        
              return icon.src;
              
        }//icon
        
        
  //:
  
  
/*
        function debug(...args){
        
              if(!df && !obj.df)return;
              args.unshift(`[ ${did} ]`);
              var fmt     = Array.from({length:args.length}).fill('%O').join(' ');
              var args2   = [fmt].concat(args);
              window.console.groupCollapsed.apply(window.console,args2);
              window.console.trace();
              window.console.groupEnd();
              
        }//debug
*/



  return obj;
  
//github-fs
})

      </script>
      
</github-fs>
