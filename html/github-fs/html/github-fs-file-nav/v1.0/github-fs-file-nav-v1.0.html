

<github-fs-file-nav style='height:300px;display:none'>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;gap:10px}
    
  file-nav
    {flex:1}
    
            </style>
            
            <section id=repo-root class=field>
                  <label>
                        repo
                  </label>
                  <img class='paste icon'>
                  <input id=repo>
                  <img class='copy icon'>
            </section>
            
            <section id=branch-root class=field>
                  <label>
                        branch
                  </label>
                  <img class='paste icon'>
                  <input id=branch value=main>
                  <img class='copy icon'>
            </section>
            
            <file-nav component></file-nav>
            
            <section id=btns>
                  <input value=update type=button>
            </section>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='github-fs-file-nav';
        
        var $,ui,par,debug,github,load,save
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    ui          = mod.rd(params,'ui',ui);
                    par         = mod.rd(params,'par',par);
                    debug       = mod.rd(params,'debug',debug);
                    github      = mod.rd(params,'github',github);
                    load        = mod.rd(params,'load',load);
                    save        = mod.rd(params,'save',save);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        
        var btn     = {};
        var file    = {};
        var dir     = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
                                                                                
              filenav         = mod['file-nav'];
              filenav.file    = file;
              filenav.dir     = dir;
              
              
              await mod.auto();
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow        = host.shadowRoot;
              
              ui.initdom(shadow);
              
              
              $(shadow,'[value=update]').onclick      = btn.update;
              
              
        }//initdom
        
        
  //:
  
  
        btn.update    = async ()=>{
        
              var path      = filenav.path;
              
              dir.read(path);
              
        }//update
        
        
  //:
  
  
        file.add    = async function(path,name){
        
              path         += name;
              var repo      = $(shadow,'#repo').value;
              var branch    = $(shadow,'#branch').value;
              var blob      = new Blob(['']);
              
              save.ui({repo,branch,path,blob});
              
        }//add
        
        
        file.rem    = async function(){
        }//rem
        
        
        file.upload   = async function(){
        }//upload
        
        
        file.download   = async function(){
        }//download
        
        
        file.dblclick   = async function(path,name){
        
              path   += name;
              
              var repo      = $(shadow,'#repo').value;
              var branch    = $(shadow,'#branch').value;
              
              load.ui(repo,branch,path);
              
        }//dblclick
        
        
        dir.read    = async function(path){
                                                                                debug('dir.read',path);
              var token     = ui.rd.token();
              var owner     = 'javascript-2020';
              var repo      = 'libs';
              var branch    = 'main';
              
              var {list,error}    = await github.dir.list.full({token,owner,repo,branch,path});
              if(error){
                                                                                console.error(error);
                    log.error(error);
                    return;
              }
              var dirs    = [];
              var files   = [];
              
              list.forEach(item=>{
              
                    if(!item.abs.startsWith(path))return;
                    if(item.type=='file'){
                          var f   = item.abs.slice(path.length);
                          if(f.indexOf('/')!=-1)return;
                          files.push(item);
                    }
                    if(item.type=='dir'){
                          var d   = item.abs.slice(0,-1);
                          if(d.lastIndexOf('/')!=path.length-1)return;
                          dirs.push(item);
                    }
                    
              });
                                                                                //console.log('dirs',dirs);
                                                                                //console.log('files',files);
              filenav.display(path,dirs,files);
              
        }//read
        
        
        dir.add = async function(){
        }//add
        
        
        dir.rem   = async function(){
        }//rem
        
        
        dir.clear   = async function(){
        }//clear
        
        
        dir.dblclick    = function(path,name){
                                                                                debug('dir.dblclick',path,name);
              dir.read(path+name);
              
        }//dblclick
        
        
        
  return obj;
  
//github-fs-file-nav
})

      </script>
      
      
</github-fs-file-nav>
