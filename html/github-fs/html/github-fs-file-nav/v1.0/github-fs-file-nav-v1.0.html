

<github-fs-file-nav style='height:300px;display:none'>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {display:flex;flex-direction:column;gap:10px}
    
  file-nav
    {flex:1}
    
            </style>
            
            <section id=repo-root class=field>
                  <label>
                        repo
                  </label>
                  <img class='paste icon'>
                  <input id=repo>
                  <img class='copy icon'>
            </section>
            
            <file-nav component></file-nav>
            
            <section id=btns>
                  <input value=update type=button>
            </section>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='github-fs-file-nav';
        
        var $,ui,par,debug,github
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $           = mod.rd(params,'$',$);
                    ui          = mod.rd(params,'ui',ui);
                    par         = mod.rd(params,'par',par);
                    debug       = mod.rd(params,'debug',debug);
                    github      = mod.rd(params,'github',github);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
                                                                                
              filenav   = mod['file-nav'];
              
              await mod.auto();
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow        = host.shadowRoot;
              
              ui.initdom(shadow);
              
              
              $(shadow,'[value=update]').onclick      = btn.update;
              
              
        }//initdom
        
        
  //:
  
  
        btn.update    = async ()=>{
        
              var token     = ui.rd.token();
              var owner     = 'javascript-2020';
              var repo      = 'libs';
              var branch    = 'main';
              var path      = '/';
              
              var {list,error}    = await github.dir.list.full({token,owner,repo,branch,path});
              if(error){
                                                                                console.error(error);
                    log.error(error);
                    return;
              }
              var dirs    = [];
              var files   = [];
              
              console.log('list',list);
              return;
              
              list.forEach(item=>{
              
                    if(!item.abs.startsWith(path))return;
                    if(item.type=='file'){
                          if(item.abs.indexOf('/')>path.length)return;
                          files.push(item);
                    }
                    if(item.type=='dir'){
                          if(item.abs.lastIndexOf('/')!=path.length)return;
                          dirs.push(item);
                    }
                    
              });
              
              console.log('dirs',dirs);
              console.log('files',files);
              
              
        }//update
        
        
  //:
  
  
  return obj;
  
//github-fs-file-nav
})

      </script>
      
      
</github-fs-file-nav>
