


<github-fs-url>

      <template shadowrootmode=open>
      
            <style>
            
            
  #url
    {margin-right:10px}
    
    
  #btns
    {display:flex;justify-content:center;gap:25px}
  [value=save]
    {margin-right:20px}
    
    
  input
    {font-size:16px;padding:5px 10px;box-sizing:border-box;}
  input:not([type])
    {flex:1}
  input[type=button]
    {cursor:pointer}
    
    
    
            </style>
            
            <section class=field>
                  <label>
                        parse url
                  </label>
                  <img class='copy icon'>
                  <img class='paste icon'>
                  <input id=url autocomplete=off spellcheck=false>
                  <input type=button value=parse>
                  <input type=button value='+'>
            </section>
            
            <div class=hr></div>
            
            <section class=field>
                  <label>
                        owner
                  </label>
                  <img class='copy icon'>
                  <img class='paste icon'>
                  <input id=owner autocomplete=off spellcheck=false>
            </section>
            
            
            <section class=field>
                  <label>
                        repo
                  </label>
                  <img class='copy icon'>
                  <img class='paste icon'>
                  <input id=repo autocomplete=off spellcheck=false>
            </section>
            
            
            <section class=field>
                  <label>
                        branch
                  </label>
                  <img class='copy icon'>
                  <img class='icon paste'>
                  <input id=branch autocomplete=off spellcheck=false value=main>
            </section>
            
            
            <section class=field>
                  <label>
                        path
                  </label>
                  <img class='copy icon'>
                  <img class='icon paste'>
                  <input id=path autocomplete=off spellcheck=false>
            </section>
            
            
            <div id=btns>
                  <input value=load type=button>
                  <input value=load-raw type=button>
                  <input value=save type=button>
                  <input value=backup type=button>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='github-fs-url';
        
        var $,par,ui,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    $         = mod.rd(params,'$',$);
                    par       = mod.rd(params,'par',par);
                    ui        = mod.rd(params,'ui',ui);
                    debug     = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var shadow;
        
        
        
        var btn   = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
                                                                                
        }//init
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow    = host.shadowRoot;
              
              ui.initdom(shadow);
              
              
              $(shadow,'[value=parse]').onclick   = btn.parse;
              $(shadow,'[value="+"]').onclick     = btn.parse.load;
              
              $(shadow,'#url').onkeydown    = e=>{
              
                                                      if(e.key=='Enter'){
                                                            btn.parse();
                                                            $(shadow,'#load').focus();
                                                      }
                                                      
                                                };
                                                
              $(shadow,'#path').onkeydown     = e=>{
              
                                                      if(e.key=='Enter'){
                                                            $(shadow,'#load').focus();
                                                      }
                                                      
                                                };
                                                
              $(shadow,'[value=load]').onclick        = btn.load;
              $(shadow,'[value=load-raw]').onclick    = btn.load.raw;
              $(shadow,'[value=save]').onclick        = btn.save;
              $(shadow,'[value=backup]').onclick      = btn.backup;
              
              
              
        }//initdom
        
        
  //:
  
  
        btn.parse   = function(e={}){
        
              if(!github){
                    alert('library not ready');
                    return;
              }
              
              var url   = $(shadow,'#url').value;
              
              var {owner,repo,branch,path}    = github.parse(url);
              
              write(owner,repo,branch,path);
              
              if(e.ctrlKey){
                    btn.load(e);
              }
              
        }//parse
        
        
        btn.parse.load    = function(e){
        
              btn.parse();
              btn.load(e);
              
        }//parse.load
        
        
        btn.load    = async function(e){
        
              var api   = true;
              if(e.shiftKey){
                    api   = false;
              }
              
              var {token,owner,repo,branch,path}    = read();
              
              var i           = path.lastIndexOf('/');
              var filename    = path.slice(i+1);
              
              
              
              var file        = {};
              file.type       = 'github';
              file.filename   = filename;
              file.title      = repo+' : '+path;
              file.icon       = icon.src;
              
              file.owner      = owner;
              file.repo       = repo;
              file.branch     = branch;
              file.path       = path;
              
              
              
              var result      = await load(file,api);
              if(result.error){
                    return;
              }
              var blob    = result.ok;
              
              obj.load.complete(file,blob);
              
        }//load
        
        
        btn.load.raw    = async function(){
        
              load(false);
              
        }//raw
        
        
        btn.save    = async function(){
        
              var {token,owner,repo,branch,path}    = read();
              
              var i               = path.lastIndexOf('/');
              var filename        = path.slice(i+1);
              
/*
              var file            = filemod.new({
              
                    filetype    : 'github',
                    abs         : path,
                    name        : filename,
                    
                    kind        : 'file',
                    size        : null,
                    ctime       : null,
                    mtime       : null,
                    atime       : null,
                    
                    title       : repo+' : '+path,
                    icon        : icon.src
                    
              });
*/


              var file            = {};
              file.type           = 'github';
              file.filename       = filename;
              file.title          = repo+' : '+path;
              file.icon           = icon.src;
              
              file.owner          = owner;
              file.repo           = repo;
              file.branch         = branch;
              file.path           = path;
              file.abs            = path;
              
              var blob            = await source(file);
              
              var result          = await save(file,blob);
              if(result.error){
                    return;
              }
              
        }//save
        
        
        btn.backup    = function(){
        
              var {token,owner,repo,branch,path}    = read();
                                                                                console.log('btn.backup');
                                                                                console.log(token,owner,repo,branch,path);
                                                                                
              github.backup(token,owner,repo,branch,path);
              
        }//backup
        
        
        
        
        
        
  //:
  
  
  return obj;
  
//github-fs-url
})


      </script>
      
</github-fs-url>
