

        <style>
        
  html
    {height:350px}
    
    
  web-console
    {border:1px solid lightgray}
    
    
  input
    {font-size:16px;padding:5px 10px}
  input[type]
    {cursor:pointer}
  input[type=checkbox]
    {width:20px;height:20px}
    
/*
  config
    {display:none}
*/

        </style>
        
        <script src='https://libs.ext-code.com/js/dom/component/v3.0/component.js?hdr'></script>
        
        
        <div style='margin-bottom:30px'>
              <input value=test type=button onclick=test()>
              <input value=log type=button onclick=log()>
              <input value=clear type=button onclick="mod['web-console'].clear()">
        </div>
        
        <web-console v3.0 component controls>
              <config>
                    {slider:false}
              </config>
        </web-console>
        
        
        
        <script>
        
        
                async function ready(){
                
                      mod['web-console'].__host.style.height    = '300px';
                      
                      
                      //mod['web-console'].hide.echo();
                      
                      
                      mod['web-console'].test();
                      
                      mod['web-console'].log(new Proxy({},{}))
                      
                      mod['web-console'].log(`
                            helloworld
                            123
                      `);
                      
                      mod['web-console'].json({hello:'world'});
                      
                      
                      mod['web-console'].focus();
                      
                }//ready
                
                
                async function test(){
                
                      for(var i=0;i<25;i++){
                      
                            mod['web-console'].log(i);
                            await new Promise(res=>setTimeout(res,500));
                            
                      }//for
                      
                }//test
                
                
                log.ct    = 0;
                
                function log(){
                
                      log.ct++;
                      mod['web-console'].log(log.ct);
                      
                }//log
                
                
                
                
                
                
        </script>
