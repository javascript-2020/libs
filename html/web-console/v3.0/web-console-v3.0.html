


<web-console>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {all:initial;font-family:arial;display:block;min-height:50px}
    
  .radio
    {border:1px solid lightgray;padding:2px 5px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:10px}
  .radio>*
    {cursor:pointer}
  .radio:has([type=checkbox]:disabled)
    {color:gray;cursor:default}
  .radio:has([type=checkbox]:disabled)>*
    {cursor:default}
    
    
            </style>
            
            
            <div id=controls style='display:none'>
            
                  <div class=spc></div>
                  
                  <span id=console-persist class=radio>
                        <input type=checkbox>
                        persist
                  </span>
                  
                  <span id=console-wrap class=radio>
                        <input type=checkbox>
                        wrap
                  </span>
                  
                  <span id=console-clear class=radio>
                        clear
                  </span>
                  
            </div>
            
            <output-inspect component=parent></output-inspect>
            
      </template>
      
      
      <script>
      
      
(function({mod,host}){

  var obj   = {
        version   : 'v3.0',
  };
  
        var df=false,did='web-console';
        
        var ext,$,ace,embed,config={},callback,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    ace         = mod.rd(params,'ace',ace);
                    embed       = mod.rd(params,'embed',embed);
                    config      = mod.rd(params,'config',config,{});
                    echo        = mod.rd(params,'echo',echo);
                    callback    = mod.rd(params,'callback',callback,callback);
                    debug       = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var inspect;
        
        
        obj.host    = host;
        
        
        var def             = {};
        def.fullsize        = false;
        def.height          = '200px';
        def.controls        = true;
        
        
        var mode    = 'inspect';
        var echo    = true;
        
        var fullsize;
        var height;
        
        
        var shadow;
        var root;
        var chk             = {};
        obj.chk             = chk;
        
        
        
        
        var rd              = {};
        rd.attr             = {};
        var btn             = {};
        var set             = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
              var dom_config    = mod.rd.config(host);
              config            = Object.assign(config,dom_config);
                                                                                debug('config',config);
                                                                                
              target    = host;
              if(embed){
                    target    = embed;
              }
              
              rd.attr.fullsize();
              rd.attr.h();
              rd.attr.height();
              rd.attr.controls();
              
              
              
              inspect         = mod['output-inspect'];
              inspect.initmod({df});
              
              
              await Promise.all([
                    libs(),
                    mod.auto(),
              ]);
              
              
        }//init
        
        
        async function libs(){
        
              var list    = [];
              
              /*
              var promise   = import('https://cdn.jsdelivr.net/npm/ansi_up/+esm').then(({AnsiUp})=>{
              
                    ansi    = new AnsiUp();
                    
              });
              list.push(promise);
              */
              
              await Promise.all(list);
              
        }//libs
        
        
  //:
  
  
        rd.attr.fullsize   = function(){
        
              if(!target.hasAttribute('fullsize'))return;
              
              def.fullsize    = true;
              
        }//fullsize
        
        
        rd.attr.h   = function(){
        
              if(!target.hasAttribute('h'))return;
              
              var h         = target.getAttribute('h');
              def.height    = int(h);
              
        }//h
        
        
        rd.attr.height    = function(){
        
              if(!target.hasAttribute('height'))return;
              
              var h         = target.getAttribute('height');
              def.height    = int(h);
              
        }//height
        
        
        rd.attr.controls    = function(){
        
              if(!target.hasAttribute('controls'))return;
              
              def.controls    = true;
              var attr    = target.getAttribute('controls');
              if(attr==='false'){
                    def.controls    = false;
              }
              
        }//controls
        
        
  //:
  
  
  
  
        obj.initdom    = function(params={}){
                                                                                debug('initdom');
              fullsize        = params.fullsize||config.fullsize||def.fullsize;
                                                                                debug('fullsize',fullsize);
              height          = params.height||params.h||config.height||config.h||def.height;
              if(height){
                    //fullsize    = false;
              }
              
              
              shadow              = host.shadowRoot;
              
              
              if(def.controls){
                    $(shadow,'#controls').style.display           = '';
              }
              
              chk.persist     = $.chkbox(shadow,'#console-persist');
              $.chkbox(shadow,'#console-wrap',btn['console-wrap'])
              
              
              if(height){
                                                                                debug('height',height);
                    set.height(height);
              }
              
              
              
              
        }//initdom
        
        
  //:
  
  
        btn['console-wrap']   = function(){
        
        }//console-wrap
        
        
  //:
  //standard:
  
  
        var api         = [
                                'assert','clear','count','countReset','debug','dir','dirxml','error','group','groupCollapsed',
                                'groupEnd','info','log','profile','profileEnd','table','time',
                                'timeEnd','timeLog','timeStamp','trace','warn'
                          ];
                          
        api.forEach(name=>{
        
              var fn      = ()=>{};
              if(window.console[name]){
                    fn    = window.console[name].bind(window.console);
              }
              obj[name]   = fn;
              
        });
        
        
        obj.clear   = clear;
        
        function clear(...args){
        
              inspect.clear(...args);
              
              if(echo){
                    window.console.clear();
              }
              
              if(fullsize){
                                                                                //console.log('clear',height);
                    obj.height    = height;
              }
              
        }//clear
        
        
        clear.display   = function(){
        
              clear();
              
        }//display
        
        
        obj.log   = log;
        
        function log(...args){
        
              inspect.log(...args);
              
              if(echo){
                    window.console.log.apply(window.console,arguments);
              }
              
        }//log
        
        
        log.display   = function(html){
        
              inspect.log.display(html);
              
        }//display
        
        
        obj.error   = error
        
        function error(...args){
        
              inspect.error(...args);
              
              if(echo){
                    window.console.error.apply(window.console,arguments);
              }
              
        }//error
        
        
        error.display   = function(html){
        
              inspect.error.display(html);
              
        }//display
        
        
        obj.warn    = warn;
        
        function warn(...args){
        
              inspect.warn(...args);
              
              if(echo){
                    window.console.warn.apply(window.console,arguments);
              }
              
        }//warn
        
        
        warn.display    = function(html){
        
              inspect.warn.display(html);
              
        }//display
        
        
  //ext:
  
  
        obj.write   = function(...args){
        
              inspect.write(...args);
              
              if(echo){
                    window.console.log.apply(window.console,arguments);
              }
              
        }//write
        
        
        obj.json    = function(){
        
              var args    = [...arguments];
              args.forEach(v=>{
              
                    var str   = JSON.stringify(v,null,4);
                    obj.log(str);
                    
              });
              
        }//json
        
        
        obj.debug   = function(...args){
        
              args.unshift('[ debug ]');
              
              inspect.log(...args);
              
              if(echo){
                    window.console.debug.apply(window.console,args);
              }
              
        }//debug
        
        
        obj.sys   = function(...args){
        
        }//sys
        
        
        
        
  //:
  
  
        //obj.height:
        Object.defineProperty(obj,'height',{set:set.height});
        
        //obj.echo:
        Object.defineProperty(obj,'echo',{get:()=>echo,set:set.echo});
        
        //obj.style:
        obj.style   = new Proxy({},{set:(obj,prop,value)=>set.style(prop,value)});
        
        
        
        set.height    = function(v){
                                                                          //window.console.log('console.height',v);
              if(!v)return;
              v   = int(v);
              if(typeof v=='number'){
                    v  += 'px';
              }
              
              //var target    = con.element;
              var target            = host;
              target.style.height   = v;
              
        }//height
        
        
        set.echo    = function(v){
        
              echo    = !!v;
              callback?.echo?.(echo);
              
        }//echo
        
        
        set.style   = function(prop,value){
        
              con.element.style[prop]   = value;
              
        }//style
        
        
  //:
  
  
        function int(str){return (/^\d+$/.test(str)) ? Number(str) : str}
        
        
        
  //:
  
  
        obj.test    = function(){
        
        
              log('helloworld');
              
              var test    = {
                    hello:'world',
                    key:'value',
                    test:123,
                    debug:true
              };
              
              log(test);
              
              
              var str   = [...Array(250)].reduce(
                    (a,v,i)=>{
                    
                          var c   = (i%10);
                          if(c==9)c+='-';
                          a+=c;
                          return a;
                          
                    },'x');
              [...Array(3)].forEach(()=>obj.log(str));
              
              log('helloworld');
              
              log('function',()=>alert(1));
              log('date',new Date());
              
              error(new Error('my-error'));
              
              warn('warning');
              
              log(null);
              
              log(undefined);
              
              var arr     = [1,2,3];
              arr.hello   = 'world';
              log(arr);
              
              
        }//test
        
        
        
  //:
  
  
  
  return obj;
  
//web_console
})


      </script>
      
      
</web-console>
