


<web-console v2.0>

      <template shadowrootmode=open>
      
            <style>
            
  :host
    {all:initial;font-family:arial;display:block;min-height:50px}
    
    
  #ftr
    {/*display:flex;*/gap:10px;display:none}
    
  #ftr>div
    {display:flex;}
    
  .icon
    {width:20px;height:20px;border:1px solid lightgray;border-radius:3px;box-sizing:border-box}
  #clear
    {}
  #log-icon
    {}
  #warn-icon
    {}
  #error-icon
    {}
    
    
            </style>
            
            
            <output-inspect v1.0 component=parent></output-inspect>
            
            
            <div id=ftr>
            
                  <img id=clear>
                  
                  <div id=log-root>
                        <img id=log-icon>
                        <div id=log></div>
                  </div>
                  
                  <div id=warn-root>
                        <img id=warn-icon>
                        <div id=warn></div>
                  </div>
                  
                  <div id=error-root>
                        <img id=error-icon>
                        <div id=error></div>
                  </div>
                  
            </div>
            
            
      </template>
      
      
      <script>
      
      
(function web_console({mod,host}){

  var obj   = {
        version   : 'v2.0',
  };
  
        var df=false,did='web-console'
        ;
        
        var ext,$,ace,embed,config={},callback
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    ace         = mod.rd(params,'ace',ace);
                    embed       = mod.rd(params,'embed',embed);
                    config      = mod.rd(params,'config',config,{});
                    echo        = mod.rd(params,'echo',echo);
                    callback    = mod.rd(params,'callback',callback,callback);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var inspect;
        
        
        obj.host    = host;
        
        
        
        var mode    = 'inspect';
        
        
        var echo    = true;
        
        
        
        
        
        var root;
        
        
        var def             = {};
        def.fullsize        = false;
        def.height          = '200px';
        
        var fullsize;
        var height;
        
        
        
        var rd              = {};
        rd.attr             = {};
        
        
        
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug('init',obj.version);
              var dom_config    = mod.rd.config(host);
              config            = Object.assign(config,dom_config);
                                                                                debug('config',config);
                                                                                
              target    = host;
              if(embed){
                    target    = embed;
              }
              
              rd.attr.fullsize();
              rd.attr.h();
              rd.attr.height();
              
              
              
              inspect         = mod['output-inspect'];
              inspect.initmod({df});
              
              
              await Promise.all([
                    libs(),
                    mod.auto(),
              ]);
              
              
        }//init
        
        
        async function libs(){
        
              var list    = [];
              
              
              /*
              var promise   = import('https://cdn.jsdelivr.net/npm/ansi_up/+esm').then(({AnsiUp})=>{
              
                    ansi    = new AnsiUp();
                    
              });
              list.push(promise);
              */
              
              await Promise.all(list);
              
        }//libs
        
        
  //:
  
  
        rd.attr.fullsize   = function(){
        
              if(!target.hasAttribute('fullsize'))return;
              
              def.fullsize    = true;
              
        }//fullsize
        
        
        rd.attr.h   = function(){
        
              if(!target.hasAttribute('h'))return;
              
              var h         = target.getAttribute('h');
              h             = int(h);
              def.height    = h;
              
        }//h
        
        
        rd.attr.height    = function(){
        
              if(!target.hasAttribute('height'))return;
              
              var h         = target.getAttribute('height');
              h             = int(h);
              def.height    = h;
              
        }//height
        
        
  //:
  
  
  
  
        obj.initdom    = function(params={}){
                                                                                debug('initdom');
              fullsize        = params.fullsize||config.fullsize||def.fullsize;
                                                                                debug('fullsize',fullsize);
              height          = params.height||params.h||config.height||config.h||def.height;
              if(height){
                    //fullsize    = false;
              }
              
              
              var shadow      = host.shadowRoot;
              
              
              if(height){
                                                                                debug('height',height);
                    obj.height      = height;
              }
              
              
              
              
        }//initdom
        
        
  //:
  
  
  //  standard
  
  
        var api         = [
                                'assert','clear','count','countReset','debug','dir','dirxml','error','group','groupCollapsed',
                                'groupEnd','info','log','profile','profileEnd','table','time',
                                'timeEnd','timeLog','timeStamp','trace','warn'
                          ];
                          
        api.forEach(name=>{
        
              var fn      = ()=>{};
              if(window.console[name]){
                    fn    = window.console[name].bind(window.console);
              }
              obj[name]   = fn;
              
        });
        
        
        obj.clear   = clear;
        
        function clear(...args){
        
              inspect.clear(...args);
              
              if(echo){
                    window.console.clear();
              }
              
              if(fullsize){
                                                                                //console.log('clear',height);
                    obj.height    = height;
              }
              
        }//clear
        
        
        obj.log   = log;
        
        function log(...args){
        
              inspect.log(...args);
              
              if(echo){
                    window.console.log.apply(window.console,arguments);
              }
              
        }//log
        
        
        log.display   = function(html){
        
              inspect.log.display(html);
              
        }//display
        
        
        obj.error   = error
        
        function error(...args){
        
              inspect.error(...args);
              
              if(echo){
                    window.console.error.apply(window.console,arguments);
              }
              
        }//error
        
        
        error.display   = function(html){
        
              inspect.error.display(html);
              
        }//display
        
        
        obj.warn    = warn;
        
        function warn(...args){debugger;
        
              inspect.warn(...args);
              
              if(echo){
                    window.console.warn.apply(window.console,arguments);
              }
              
        }//warn
        
        
        warn.display    = function(html){
        
              inspect.warn.display(html);
              
        }//display
        
        
  //  ext
  
  
        obj.write   = function(...args){
        
              inspect.write(...args);
              
              if(echo){
                    window.console.log.apply(window.console,arguments);
              }
              
        }//write
        
        
        obj.json    = function(){
        
              var args    = [...arguments];
              args.forEach(v=>{
              
                    var str   = JSON.stringify(v,null,4);
                    obj.log(str);
                    
              });
              
        }//json
        
        
        obj.debug   = function(...args){
        
              args.unshift('[ debug ]');
              
              inspect.log(...args);
              
              if(echo){
                    window.console.debug.apply(window.console,args);
              }
              
        }//debug
        
        
        obj.sys   = function(...args){
        
        }//sys
        
        
        
        
  //:
  
  
        Object.defineProperty(obj,'height',{
        
              set   : v=>{
                                                                          //window.console.log('console.height',v);
                    if(!v)return;
                    v   = int(v);
                    if(typeof v=='number'){
                          v  += 'px';
                    }
                    
                    //var target    = con.element;
                    var target            = host;
                    target.style.height   = v;
                    
              },
              
        });
        
        
        Object.defineProperty(obj,'echo',{
        
              get   : ()=>echo,
              set   : v=>{
              
                            echo    = !!v;
                            callback?.echo?.(echo);
                            
                      }//set
                      
        });
        
        
        obj.style   = new Proxy({},{
        
              set   : (obj,prop,value)=>{
              
                    con.element.style[prop]   = value;
                    
              }
              
        });
        
        
        
  //:
  
  
        function int(str){return (/^\d+$/.test(str)) ? Number(str) : str}
        
        
        
  //:
  
  
        obj.test    = function(){
        
        
              log('helloworld');
              
              var test    = {
                    hello:'world',
                    key:'value',
                    test:123,
                    debug:true
              };
              
              log(test);
              
              
              var str   = [...Array(250)].reduce(
                    (a,v,i)=>{
                    
                          var c   = (i%10);
                          if(c==9)c+='-';
                          a+=c;
                          return a;
                          
                    },'x');
              [...Array(3)].forEach(()=>obj.log(str));
              
              log('helloworld');
              
              log('function',()=>alert(1));
              log('date',new Date());
              
              error(new Error('my-error'));
              
              warn('warning');
              
              log(null);
              
              log(undefined);
              
              log([1,2,3]);
              
              
        }//test
        
        
        
  //:
  
  
  
  return obj;
  
//web_console
})


      </script>
      
      
</web-console>
