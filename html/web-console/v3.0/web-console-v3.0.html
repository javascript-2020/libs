      <script>
      
      
(function({mod,host}){

  var obj   = {
        version   : 'v3.0',
  };
  
        var df=false,did='web-console';
        
        var ext,$,ace,embed,config={},callback,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    ace         = mod.rd(params,'ace',ace);
                    embed       = mod.rd(params,'embed',embed);
                    config      = mod.rd(params,'config',config,{});
                    echo        = mod.rd(params,'echo',echo);
                    callback    = mod.rd(params,'callback',callback,callback);
                    debug       = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //:
  
  
        var inspect;
        
        
        obj.host                  = host;
        
        
        var def                   = {};
        def.fullsize              = false;
        def.height                = '200px';
        def.controls              = true;
        
        var mode                  = 'inspect';
        var echo                  = true;
        
        var fullsize;
        var height;
        
        var timer                 = {};
        timer.delay               = 300;
        timer['page-up']          = Date.now();
        timer['page-down']        = Date.now();
        timer.anim                = null;
        
        var listeners             = {};
        listeners.height          = [];
        
        var shadow;
        var root;
        var chk                   = {};
        obj.chk                   = chk;
        var icons;
        var search                = {};
        var info                  = {};
        
        var slider                = {};
        
        var rd                    = {};
        rd.attr                   = {};
        var btn                   = {};
        var set                   = {};
        var show                  = {};
        obj.show                  = show;
        var hide                  = {};
        obj.hide                  = hide;
        var on                    = {};
        obj.on                    = {};
        obj.add                   = {};
        
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug=eval(debug.mod);
                                                                                debug('init',obj.version);
              var dom_config    = mod.rd.config(host);
              config            = Object.assign(config,dom_config);
                                                                                debug('config',config);
                                                                                
              target    = host;
              if(embed){
                    target    = embed;
              }
              
              rd.height();
              rd.attr.fullsize();
              rd.attr.h();
              rd.attr.height();
              rd.attr.controls();
              
              
              
              inspect         = mod['output-inspect'];
              inspect.initmod({df});
              
              
              await Promise.all([
                    libs(),
                    mod.auto(),
              ]);
              
              
        }//init
        
        
        async function libs(){
        
              var list    = [];
              
              /*
              var promise   = import('https://cdn.jsdelivr.net/npm/ansi_up/+esm').then(({AnsiUp})=>{
              
                    ansi    = new AnsiUp();
                    
              });
              list.push(promise);
              */
              
              await Promise.all(list);
              
        }//libs
        
        
  //:
  
  
        rd.height   = function(){
        
              /*
              if(host.offsetHeight>101){
                    def.height    = host.offsetHeight;
              }
              */
              
        }//height
        
        
        rd.attr.fullsize   = function(){
        
              if(!target.hasAttribute('fullsize'))return;
              
              def.fullsize    = true;
              
        }//fullsize
        
        
        rd.attr.h   = function(){
        
              if(!target.hasAttribute('h'))return;
              
              var h         = target.getAttribute('h');
              def.height    = int(h);
              
        }//h
        
        
        rd.attr.height    = function(){
        
              if(!target.hasAttribute('height'))return;
              
              var h         = target.getAttribute('height');
              def.height    = int(h);
              
        }//height
        
        
        rd.attr.controls    = function(){
        
              if(!target.hasAttribute('controls'))return;
              
              def.controls    = true;
              var attr    = target.getAttribute('controls');
              if(attr==='false'){
                    def.controls    = false;
              }
              
        }//controls
        
        
  //:
  
  
  
  
        obj.initdom    = function(params={}){
                                                                                debug('initdom');
              fullsize        = params.fullsize||config.fullsize||def.fullsize;
                                                                                debug('fullsize',fullsize);
              height          = params.height||params.h||config.height||config.h;//||def.height;
              if(height){
                    //fullsize    = false;
              }
              
              
              host.onkeydown                                      = kd;
              
              shadow                                              = host.shadowRoot;
              
              if(def.controls){
                    $(shadow,'#controls').style.display           = '';
              }
              
              info.root                                           = $(shadow,'#info');
              if(info.root){
                    info.card                                     = $(info.root,'#card');
                    $(info.card,'#version').textContent           = obj.version;
                    info.root.onmouseenter                        = info.me;
                    info.root.onmouseleave                        = info.ml;
              }
              
              $(shadow,'#collapse').onclick                       = btn.collapse;
              
              $(shadow,'#page-up').onclick                        = btn['page-up'];
              $(shadow,'#page-down').onclick                      = btn['page-down'];
              
              $(shadow,'#stop').onclick                           = btn.stop;
              $(shadow,'#pause').onclick                          = btn.pause;
              $(shadow,'#play').onclick                           = btn.play;
              
              var root                                            = $(shadow,'#search-root');
              search.filter                                       = $.chkbox(root,'#filter',btn.filter);
              $(root,'#search-clear').onclick                     = e=>{search.input.value='';search.input.focus()}
              search.input                                        = $(root,'#search');
              search.input.oninput                                = search.oninput;
              search.input.onkeydown                              = e=>e.stopPropagation();
              //search.input.onfocus                                = e=>search.input.select();
              
              $(shadow,'#spc').onclick                            = btn.spc;
              $(shadow,'#marker').onclick                         = btn.marker;
              
              chk.echo                                            = $.chkbox(shadow,'#echo',btn.echo);
              chk.persist                                         = $.chkbox(shadow,'#persist');
              
              var root        = $(shadow,'#ws');
              var grp         = $.chkbox.group(root,'#nowrap','#pre','#pre-wrap');
              grp.callback    = btn.wrap;
              
              $(shadow,'#clear').onclick                          = btn.clear;
              
              icons                                               = $(shadow,'#icons');
              
              if(height){
                                                                                debug('height',height);
                    set.height(height);
              }
              if(config.slider===false){
                    hide.slider();
              }
              
              $.slider(host,'#slider',null,slider,{root:shadow,mode:'horiz'});
              
        }//initdom
        
        
        obj.focus   = function(){
        
              host.focus();
              
        }//focus
        
        
  //:
  
  
        function kd(e){
                                                                                console.log(e.key);
              var f   = true;
              switch(e.key){
              
                case 'PageUp'     :
                                    if(e.shiftKey){
                                          inspect.top();
                                    }else{
                                          inspect['page-up']();
                                    }
                                    break;
                case 'PageDown'   :
                                    if(e.shiftKey){
                                          inspect.bottom();
                                    }else{
                                          inspect['page-down']();
                                    }
                                    break;
                case ' '          :
                                    inspect.sys.spc();
                                    break;
                case '-'          :
                                    inspect.sys.marker();
                                    break;
                case 'Escape'     :
                                    inspect.clear();
                                    break;
                default           :
                                    f   = false;
                                    
              }//switch
              
              if(f){
              }
              
        }//kd
        
        
        info.me   = function(){
        
              var card              = $(shadow,'#info #card');
              card.style.display    = '';
              
        }//me
        
        
        info.ml   = function(){
        
              var card    = $(shadow,'#info #card');
              var ml      = ()=>card.style.display='none';
              setTimeout(ml,500);
              
        }//ml
        
        
        {
        
              let h;
              
              btn.collapse    = function(){
              
                    var node    = $(shadow,'output-inspect');
                    
                    host.style.transition   = '0.3s';
                    host.ontransitionend    = end;
                    
                    if(host.style.height==='20px'){
                          host.style.height   = h+'px';
                          //node.style.flex     = 1;
                          $(shadow,'#collapse').style.transform   = '';
                    }else{
                          h   = host.offsetHeight;
                          host.style.height   = '20px';
                          //node.style.flex     = 'initial';
                          $(shadow,'#collapse').style.transform   = 'rotateZ(-90deg)';
                    }
                    
                    
                    timer.anim    = window.requestAnimationFrame(()=>anim('height'));

                          window.cancelAnimationFrame(timer.anim);
                          host.style.transition   = '';
                          
                    }//end
