      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v2.0',
  };
  
        var df=false,did='electron-fs'
        ;
        
        var ext,$,menu,source,filemod,log,debug
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    ext         = mod.rd(params,'ext',ext);
                    $           = mod.rd(params,'$',$);
                    menu        = mod.rd(params,'menu',menu);
                    source      = mod.rd(params,'source',source);
                    filemod     = mod.rd(params,'filemod',filemod);
                    log         = mod.rd(params,'log',log);
                    debug       = mod.rd(params,'debug',debug);
                    
              });
              
        }//initmod
        
        
  //vars:-
  
  
  
        var electron;
        
        
        var filenav;
        
        var filetype    = 'electron';
        
        var shadow;
        var icon;
        
        
        var btn         = {};
        var file        = {};
        var dir         = {};
        
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug('init',obj.version);
                                                                                
              electron                  = window.electronAPI;
              if(!electron){
                                                                                debug('not enabled');
                    return;
              }
                                                                                debug('enabled');
              filenav                   = mod['file-nav'];
              
              filenav.file.add          = file.add;
              filenav.file.rem          = file.rem;
              filenav.file.click        = file.click;
              filenav.file.dblclick     = file.dblclick;
              
              filenav.dir.read          = dir.read;
              filenav.dir.add           = dir.add;
              filenav.dir.rem           = dir.rem;
              filenav.dir.clear         = dir.clear;
              filenav.dir.click         = dir.click;
              filenav.dir.dblclick      = dir.dblclick;
              
              await mod.auto();
              
              
        }//init
        
        
  //:
  
  
        obj.initdom   = function(){
        
              if(!electron){
                    return;
              }
                                                                                debug('initdom');
                                                                                
              shadow                                  = host.shadowRoot;
              
              menu.add.style(shadow);
              
              var style                               = $(shadow,'style');
              $.stylesheet.insert(style,'.icon');
              
              
              var node                                = $(shadow,'.menu');
              icon                                    = $(shadow,'.icon');
              icon.onclick                            = menu.click(node,'both',false);
              icon.style.display                      = '';
              
              
              $(shadow,'[value=load]').onclick        = btn.load;
              $(shadow,'[value=save]').onclick        = btn.save;
              $(shadow,'[value=dir]').onclick         = btn.dir;
              
              
        }//initdom
        
        
  //:
  
  
        btn.load    = function(){
                                                                                debug('btn.load');
              if(filenav.cur.type!=='file'){
                    alert('no file selected');
                    return;
              }
              
              var path        = filenav.cur.path;
              var filename    = filenav.cur.filename;
                                                                                debug(path,filename);
              load.ui(path,filename);
              
              
        }//load
        
        
        btn.save    = function(){
                                                                                debug('btn.save');
              if(filenav.cur.type!=='file'){
                    alert('no file selected');
                    return;
              }
              
              
              var path        = filenav.cur.path;
              var filename    = filenav.cur.filename;
              
              save.ui(path,filename);
              
        }//save
        
        
        btn.dir   = function(){
        }//dir
        
        
        function menu_callback(){
                                                                                console.log('menu_callback',arguments);
        }//menu_callback
        
        
  //:
  
  
        obj.update    = update;
        
        function update(path){
        
              if(!filenav)return;
              
              filenav.update(path);
              
        }//update
        
        
  //file:
  
  
        file.click    = function(path,name){
                                                                                debug('file.click',path,name);
        }//click
        
        
        file.dblclick   = function(path,name){
                                                                                debug('file.dblclick',path,name);
              load.ui(path,name);
              
        }//dblclick
        
        
        file.add    = async function(path,name){
                                                                                debug('file.add',path,name);
              path             += name;
              var {ok,error}    = await electron.file.add({path});
              if(error){
                    console.error(error);
                    return;
              }
              
        }//add
        
        
        file.rem    = async function(path,name){
                                                                                debug('file.rem',path,name);
              path             += name;
              var {ok,error}    = await electron.file.del({path});
              if(error){
                    console.error(error);
                    return;
              }
              
        }//rem
        
        
  //dir:
  
  
        dir.read    = async function(path){
                                                                                debug('dir.read',path);
              var {files,dirs,error}    = await electron.dir.read({path});
              
              if(error){
                    console.error(error);
                    return;
              }
              
              filenav.display(path,dirs,files);
              
              return false;
              
        }//read
        
        
        dir.add   = async function(path,name){
                                                                                debug('dir.add',path,name);
              path             += name;
              var {ok,error}    = await electron.dir.add({path});
              if(error){
                    console.error(error);
                    return;
              }
              
        }//add
        
        
        dir.rem   = async function(path,name){
                                                                                debug('dir.rem',path,name);
              path             += name;
              var {ok,error}    = await electron.dir.del({path});
              if(error){
              
        }//rem
        
        
        dir.clear   = async function(path,name){
                                                                                debug('dir.clear',path,name);
              path             += name;
              var {ok,error}    = await electron.dir.clear({path});
              if(error){
                    console.error(error);
                    return;
              }
              
        }//clear
        
        
        dir.click   = function(path,name){
        }//click
        
        
        dir.dblclick    = function(path,name){
                                                                                debug('dir.dblclick',path,name);
              var abs   = path+name;
              filenav.update(abs);
              
        }//dblclick
        
        
  //:
  
  
        load.ui   = async function(path,filename){
                                                                                debug('load.ui',path,filename);
              var title       = `${path}\n${filename}`;
              
              var file;
              
              if(filemod){
                    file            = filemod.newfile({
                    
                          filetype    : filetype,
                          abs         : `${path}${filename}`,
                          path        : path,
                          name        : filename,
                          
                          kind        : 'file',
                          size        : null,
                          ctime       : null,
                          mtime       : null,
                          atime       : null,
                          
                          title       : title,
                          icon        : icon.src
                          
                    });
              }else{
                    file            = {
                    
                          filetype    : filetype,
                          abs         : `${path}${filename}`,
                          path        : path,
                          name        : filename,
                          
                          kind        : 'file',
                          size        : null,
                          ctime       : null,
                          mtime       : null,
                          atime       : null,
                          
                          title       : title,
                          icon        : icon.src
                          
                    };
              }
              
              var result      = await load(file);
              if(result===false){
                     return;
              }
              var blob    = result;
              
              obj.load?.complete?.(file,blob);
              
              return blob;
              
        }//load.ui
        
        
        obj.load    = load;
        
        async function load(file){
                                                                                debug('load',file);
              var path    = file.abs;
              var buf     = await electron.file.read({path});
              var blob    = new Blob([buf]);
              return blob;
              
        }//load
        
        
        save.ui   = async function(path,filename){
                                                                                debug('save.ui',path,filename);
              var title       = `${path}${filename}`;
              
              var file;
              if(filemod){
                    file            = filemod.newfile({
                    
                          filetype    : filetype,
                          abs         : path,
                          path        : path,
                          name        : filename,
                          
                          kind        : 'file',
                          size        : null,
                          ctime       : null,
                          mtime       : null,
                          atime       : null,
                          
                          title       : title,
                          icon        : icon.src
                          
                    });
              }else{
                    file            = {
                    
                          filetype    : filetype,
                          abs         : `${path}${filename}`,
                          path        : path,
                          name        : filename,
                          
                          kind        : 'file',
                          size        : null,
                          ctime       : null,
                          mtime       : null,
                          atime       : null,
                          
                          title       : title,
                          icon        : icon.src
                          
                    }
              }
              
              
              var blob        = await source();
              
              var result      = await save(file,blob);
              if(result===false){
                    return;
              }
              
              
        }//save.ui
        
        
        obj.save    = save;
        
        async function save(file,blob){
                                                                                debug('save',file);
              var path      = file.abs;
              var buf       = await blob.arrayBuffer();
              buf           = new Uint8Array(buf);
              var {error}   = await electron.file.write({path,buf});
              if(error){
                                                                                console.error(error);
                    return false;
              }
              
              obj.save?.complete?.(file);
              
              return true;
              
        }//save
        
        
        
  //:
  
/*
        function debug(...args){
        
              if(!df && !obj.df)return;
              args.unshift(`[ ${did} ]`);
              var fmt     = Array.from({length:args.length}).fill('%O').join(' ');
              var args2   = [fmt].concat(args);
              console.groupCollapsed.apply(console,args2);
              console.trace();
              console.groupEnd();
              
        }//debug
*/




  return obj;
  
})

      </script>
