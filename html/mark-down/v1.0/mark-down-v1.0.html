

<mark-down class=markdown-body>

      <template shadowrootmode=open>
      
            <link rel=stylesheet href='https://ext-code.com/css/github-markdown-light.css'>
            
            <script src='https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js'></script>
            <script src='https://cdn.jsdelivr.net/npm/markdown-it-attrs@4.3.1/markdown-it-attrs.browser.min.js'></script>
            <script src='https://cdn.jsdelivr.net/npm/markdown-it-container@4.0.0/dist/markdown-it-container.min.js'></script>
            
            <style>
            
            </style>
            
            <div id=root>
            </div>
            
      </template>
      
      <script>
      
(function({mod,host}){

  var obj   = {
        version   : 'v1.0',
  };
  
        var df=true,did='mark-down';
        
        var debug,$
        ;
        
        obj.initmod   = function(...list){
        
              list.forEach(params=>{
              
                    debug   = mod.rd(params,'debug',debug);
                    $       = mod.rd(params,'$',$);
                    
              });
              
        }//initmod
        
        
  //vars:
  
  
        var json5;
        var md;
        
        var def   = {};
        
        
        var rd    = {};
        rd.attr   = {};
        var net   = {};
        
  //:
  
  
        obj.init    = async function(){
        
              mod.initmod(obj);
                                                                                debug('init');
              await libs();
              
              md    = markdownit({
                    html          : true,
                    breaks        : false,
                    linkify       : true,
                    linkTarget    : '_blank',
              });
              md.use(markdownItAttrs,{leftDelimiter:'{',rightDelimiter:'}',allowedAttributes:['id','class',/^data-.*$/]});
              
              
              await mod.auto();
              
              
        }//init
        
        
        async function libs(){
        
              var list    = [];
              
              var promise   = await net.import('https://esm.sh/json5').then(({result,error})=>{
              
                    if(error){
                          log.red(error);
                          return;
                    }
                    json5   = result;
                    
              });
              list.push(promise);
              
/*
              var promise   = await net.fetch('/css/page.css').then({txt,error}=>{
              
                    if(error){
                          log.red(error);
                          return;
                    }
                    var sheet                       = new CSSStyleSheet();
                    sheet.replaceSync(txt);
                    shadowRoot.adoptedStyleSheets   = [sheet];
                    
              });
              list.push(promise);
*/

              await Promise.all(list);
              
        }//libs
        
        
        rd.attr.src   = async function(){
        
              if(!host.hasAttribute('src'))return;
              var src   = host.getAttribute('src');
              var {txt,error}   = await net.fetch(src);
              if(error){
                    log.red(error);
                    return;
              }
              def.md    = txt;
              
        }//src
        
        
  //:
  
  
        obj.initdom   = async function(){
                                                                                debug('initdom');
              shadow    = host.shadowRoot;
              
              
        }//initdom
        
        
  //:
  
  
        obj.set   = function(txt){
        
              var html    = md.render(txt);
              shadow.replaceChildren();
              shadow.innerHTML(html);
              
        }//set
        
        
  //:
  
  
        net.fetch   = async function(url){
        
              var err;
              try{
              
                    var res   = await fetch(url);
                    
              }//try
              catch(err2){
              
                    err   = err2;
                    
              }//catch
              if(err){
                    var error   = err.message;
                    return {error};
              }
              if(!res.ok){
                    var error   = await res.text();
                    return {error};
              }
              
              var txt   = await res.text();
              return {txt};
              
        }//get
        
        
        net.import    = async function(url){
        
              var err;
              try{
              
                    var result    = await import(url);
                    
              }//try
              catch(err2){
              
                    err   = err2;
                    
              }//catch
              if(err){
                    var error   = err.message;
                    return {error};
              }
              return {result};
              
        }//import
        
        
        
  return obj;
  
//mark-down
})

      </script>
      
</mark-down>
